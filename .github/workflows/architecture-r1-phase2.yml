jobs:
  remote-input-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/architecture-r1-20261008
          fetch-depth: 0

      - name: Extract pure remote input state into RemoteInputCore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pkg = Path('SiriRemoteCore/Package.swift')
          text = pkg.read_text()
          text = text.replace(
              'products: [.library(name: "SiriRemoteCore", type: .static, targets: ["SiriRemoteCore"])],',
              'products: [\n        .library(name: "SiriRemoteCore", type: .static, targets: ["SiriRemoteCore"]),\n        .library(name: "RemoteInputCore", type: .static, targets: ["RemoteInputCore"]),\n    ],'
          )
          text = text.replace(
              '        .target(name: "SiriRemoteCore"),\n        .testTarget(name: "SiriRemoteCoreTests", dependencies: ["SiriRemoteCore"]),',
              '        .target(name: "SiriRemoteCore"),\n        .target(name: "RemoteInputCore"),\n        .testTarget(name: "SiriRemoteCoreTests", dependencies: ["SiriRemoteCore"]),\n        .testTarget(name: "RemoteInputCoreTests", dependencies: ["RemoteInputCore"]),'
          )
          if 'RemoteInputCore' not in text:
              raise SystemExit('Package.swift transformation failed')
          pkg.write_text(text)

          source = Path('SiriRemoteCore/Sources/RemoteInputCore/RemoteInputState.swift')
          source.parent.mkdir(parents=True, exist_ok=True)
