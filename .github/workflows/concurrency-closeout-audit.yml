name: Concurrency Closeout Audit

on:
  push:
    branches:
      - 'chatgpt/concurrency-closeout-20261008'
    paths-ignore:
      - '.concurrency-audit.txt'

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Temporary closeout audit: removed before the final PR.
      - name: Capture concurrency inventory
        run: |
          set -euo pipefail
          echo '=== unchecked Sendable ==='
          grep -R -n --include='*.swift' '@unchecked Sendable' app SiriRemoteCore || true
          echo
          echo '=== Dispatch / lock ownership markers ==='
          grep -R -n -E --include='*.swift' 'DispatchQueue|NSLock|OSAllocatedUnfairLock|os_unfair_lock|DispatchSpecificKey|DispatchWorkItem|Timer\.' app SiriRemoteCore | head -n 800 || true

      - name: Strict concurrency build and test SiriRemoteCore
        run: |
          set -o pipefail
          swift build --package-path SiriRemoteCore \
            -Xswiftc -warn-concurrency \
            -Xswiftc -strict-concurrency=complete \
            2>&1 | tee core-strict.log
          swift test --package-path SiriRemoteCore \
            -Xswiftc -warn-concurrency \
            -Xswiftc -strict-concurrency=complete \
            2>&1 | tee core-test-strict.log

      - name: Instrument app build for complete concurrency diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.sh')
          text = path.read_text()
          needle = 'swiftc \\\n'
          replacement = 'swiftc \\\n    -warn-concurrency \\\n    -strict-concurrency=complete \\\n'
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'expected exactly two swiftc invocations, found {count}')
          path.write_text(text.replace(needle, replacement))
          PY
          git diff -- app/build.sh

      - name: Strict concurrency build app
        working-directory: app
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee ../app-strict.log

      - name: Write concise audit report
        if: always()
        run: |
          {
            echo '# Swift concurrency closeout audit'
            echo
            echo '## SiriRemoteCore diagnostics'
            grep -E '(^|/)[^:]+:[0-9]+:[0-9]+: (warning|error):' core-strict.log core-test-strict.log | sort -u || true
            echo
            echo '## App diagnostics'
            grep -E '(^|/)[^:]+:[0-9]+:[0-9]+: (warning|error):' app-strict.log | sort -u || true
            echo
            echo '## @unchecked Sendable inventory'
            grep -R -n --include='*.swift' '@unchecked Sendable' app SiriRemoteCore | sort || true
            echo
            echo '## synchronous queue hops'
            grep -R -n -E --include='*.swift' 'DispatchQueue\.main\.sync|\.sync\s*\{' app SiriRemoteCore | sort || true
          } > .concurrency-audit.txt
          cat .concurrency-audit.txt

      - name: Persist audit report on the temporary branch
        if: always()
        run: |
          git checkout -- app/build.sh
          git config user.name "tevriq"
          git config user.email "318064862+tevriq@users.noreply.github.com"
          git add .concurrency-audit.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: capture concurrency audit report By ChatGPT"
          git push origin HEAD
