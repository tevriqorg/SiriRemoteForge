name: Concurrency Closeout Wave 1

on:
  push:
    branches:
      - 'chatgpt/concurrency-closeout-20261008'
    paths:
      - '.github/workflows/concurrency-closeout-wave1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply behavior-preserving actor annotations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'SiriRemoteCore/Sources/SiriRemoteCore/CircularScroll.swift': [
                  ('public struct CircularScrollConfig: Equatable {',
                   'public struct CircularScrollConfig: Equatable, Sendable {'),
              ],
          }

          actor_types = {
              'app/SiriRemoteApp.swift': ['AppDelegate'],
              'app/StatusWidget.swift': ['StatusWidgetController'],
              'app/AppWheel.swift': ['AppWheelController'],
              'app/CursorHighlighter.swift': ['CursorHighlighter'],
              'app/DemoMode.swift': ['DemoModeWindowController'],
              'app/DragIndicator.swift': ['DragIndicator'],
              'app/HoldAnimationGallery.swift': ['HoldAnimationGalleryController'],
              'app/HoldProgressHUD.swift': ['HoldProgressHUD'],
              'app/LayerHUD.swift': ['LayerHUD'],
              'app/MenuBarManager.swift': ['MenuBarManager'],
              'app/SettingsWindow.swift': ['SettingsWindowController'],
              'app/SetupWizard.swift': ['SetupWizardController', 'SetupModel'],
              'app/VoiceOrbHUD.swift': ['VoicePipelineHUDController'],
              'app/VoicePipelineHUD.swift': ['LegacyVoicePipelineHUDController'],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          for filename, names in actor_types.items():
              path = Path(filename)
              text = path.read_text()
              for name in names:
                  # Accept access modifiers and final/non-final classes. Do not double annotate.
                  pattern = re.compile(rf'(?m)^(?P<indent>\s*)(?P<decl>(?:(?:private|fileprivate|internal|public|open)\s+)?(?:final\s+)?class\s+{re.escape(name)}\b)')
                  matches = list(pattern.finditer(text))
                  if len(matches) != 1:
                      raise SystemExit(f'{filename}: expected one class {name}, found {len(matches)}')
                  m = matches[0]
                  line_start = m.start()
                  prefix = text[max(0, line_start-32):line_start]
                  if '@MainActor' in prefix.split('\n')[-2:]:
                      continue
                  text = text[:line_start] + f'{m.group("indent")}@MainActor\n' + text[line_start:]
              path.write_text(text)
          PY
          git diff --check
          git diff --stat

      - name: Build Core
        run: |
          swift build --package-path SiriRemoteCore
          swift test --package-path SiriRemoteCore

      - name: Build App normally
        working-directory: app
        run: ./build.sh

      - name: Commit safe annotations
        run: |
          git config user.name "tevriq"
          git config user.email "318064862+tevriq@users.noreply.github.com"
          git add SiriRemoteCore app
          git commit -m "refactor: declare main-thread UI ownership By ChatGPT"
          git push origin HEAD
