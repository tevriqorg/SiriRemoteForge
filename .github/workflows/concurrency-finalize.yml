name: Concurrency Finalize

on:
  push:
    branches:
      - 'chatgpt/concurrency-closeout-20261008'
    paths:
      - '.github/workflows/concurrency-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final safe Sendable declarations and build switch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('app/TuneSettings.swift',
                       'struct TuneSettings: Codable, Equatable {',
                       'struct TuneSettings: Codable, Equatable, Sendable {')

          replace_once('app/VoiceTranscriptionClient.swift',
                       'final class VoiceRealtimeTranscriptionSession {',
                       '''/// URLSessionWebSocketTask is thread-safe, transcript state is actor-owned, and the only\n/// mutable local lifecycle bit (`closed`) is protected by `closeLock`. `receiveTask` is installed\n/// during `connect` before the session escapes to callers.\nfinal class VoiceRealtimeTranscriptionSession: @unchecked Sendable {''')

          replace_once('app/VoiceFeedbackSound.swift',
                       'final class VoiceFeedbackSound {',
                       '''/// All mutable AVAudioPlayer state is confined to `playbackQueue`; public playback only\n/// enqueues work and never exposes a player reference.\nfinal class VoiceFeedbackSound: @unchecked Sendable {''')

          replace_once('app/VoiceTextProcessing.swift',
                       'final class VoiceTextProcessor {',
                       '''/// URLSession is safe for concurrent use, VoiceHistoryStore owns its queue, and every\n/// mutable prewarm cache/set is protected by `prewarmLock`.\nfinal class VoiceTextProcessor: @unchecked Sendable {''')

          replace_once('app/VoiceTextDelivery.swift',
                       'final class VoiceTextDeliverer {',
                       '''/// This facade has no mutable state beyond the queue-confined Sendable worker. AppKit/\n/// pasteboard operations remain explicitly @MainActor at their call sites.\nfinal class VoiceTextDeliverer: Sendable {''')

          p = Path('app/build.sh')
          text = p.read_text()
          marker = 'echo "Building HyperVibe..."\n\n'
          insertion = '''echo "Building HyperVibe..."\n\n# Opt-in strict concurrency diagnostics. Ordinary developer/release builds retain the exact\n# historical compiler mode; CI enables this and compares diagnostics against the checked-in debt\n# baseline so new Swift concurrency warnings cannot enter unnoticed.\nSWIFT_CONCURRENCY_FLAGS=()\nif [ "${HYPERVIBE_STRICT_CONCURRENCY:-0}" = "1" ]; then\n    SWIFT_CONCURRENCY_FLAGS=(-warn-concurrency -strict-concurrency=complete)\nfi\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('build.sh marker mismatch')
          text = text.replace(marker, insertion, 1)
          needle = 'swiftc \\\n'
          replacement = 'swiftc \\\n    "${SWIFT_CONCURRENCY_FLAGS[@]}" \\\n'
          if text.count(needle) != 2:
              raise SystemExit(f'expected two swiftc invocations, found {text.count(needle)}')
          text = text.replace(needle, replacement)
          p.write_text(text)
          PY
          git diff --check

      - name: Generate strict App diagnostic baseline
        run: |
          set -o pipefail
          (cd app && HYPERVIBE_STRICT_CONCURRENCY=1 ./build.sh) 2>&1 | tee /tmp/app-strict-final.log
          mkdir -p scripts
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          rx = re.compile(r'^(?P<file>.*?\.swift):\d+:\d+: warning: (?P<message>.*)$')
          counts = Counter()
          for line in Path('/tmp/app-strict-final.log').read_text(errors='replace').splitlines():
              m = rx.match(line)
              if not m:
                  continue
              key = (Path(m.group('file')).name, m.group('message').strip())
              counts[key] += 1
          with Path('scripts/swift-concurrency-baseline.txt').open('w') as f:
              f.write('# count<TAB>file<TAB>warning fingerprint\n')
              for (file, message), count in sorted(counts.items()):
                  f.write(f'{count}\t{file}\t{message}\n')
          print(f'Baseline fingerprints: {len(counts)}; warning instances: {sum(counts.values())}')
          PY

      - name: Add permanent concurrency gate and documentation
        run: |
          cat > scripts/check-swift-concurrency.sh <<'SH'
          #!/bin/bash
          set -euo pipefail

          ROOT="$(cd "$(dirname "$0")/.." && pwd)"
          BASELINE="$ROOT/scripts/swift-concurrency-baseline.txt"
          LOG="${TMPDIR:-/tmp}/siriremoteforge-app-strict-$$.log"
          CURRENT="${TMPDIR:-/tmp}/siriremoteforge-app-strict-current-$$.txt"
          trap 'rm -f "$LOG" "$CURRENT"' EXIT

          test -f "$BASELINE" || { echo "Missing concurrency baseline: $BASELINE" >&2; exit 1; }

          set -o pipefail
          (cd "$ROOT/app" && HYPERVIBE_STRICT_CONCURRENCY=1 ./build.sh) 2>&1 | tee "$LOG"

          python3 - "$LOG" "$CURRENT" <<'PY'
          from collections import Counter
          from pathlib import Path
          import re, sys

          source, output = map(Path, sys.argv[1:3])
          rx = re.compile(r'^(?P<file>.*?\.swift):\d+:\d+: warning: (?P<message>.*)$')
          counts = Counter()
          for line in source.read_text(errors='replace').splitlines():
              m = rx.match(line)
              if m:
                  counts[(Path(m.group('file')).name, m.group('message').strip())] += 1
          with output.open('w') as f:
              for (file, message), count in sorted(counts.items()):
                  f.write(f'{count}\t{file}\t{message}\n')
          PY

          python3 - "$BASELINE" "$CURRENT" <<'PY'
          from pathlib import Path
          import sys

          def load(path):
              result = {}
              for raw in Path(path).read_text().splitlines():
                  if not raw or raw.startswith('#'):
                      continue
                  count, file, message = raw.split('\t', 2)
                  result[(file, message)] = int(count)
              return result

          baseline = load(sys.argv[1])
          current = load(sys.argv[2])
          regressions = []
          for key, count in sorted(current.items()):
              allowed = baseline.get(key, 0)
              if count > allowed:
                  regressions.append((key, allowed, count))

          if regressions:
              print('New Swift concurrency diagnostics detected:', file=sys.stderr)
              for (file, message), allowed, count in regressions:
                  print(f'  {file}: {message} (baseline {allowed}, now {count})', file=sys.stderr)
              raise SystemExit(1)

          removed = sum(max(0, baseline.get(key, 0) - count) for key, count in current.items())
          removed += sum(count for key, count in baseline.items() if key not in current)
          print(f'Concurrency gate passed: {sum(current.values())} known warning instances; baseline can only shrink.')
          if removed:
              print(f'Note: {removed} baseline warning instance(s) disappeared; update the baseline in the same change.')
          PY
          SH
          chmod +x scripts/check-swift-concurrency.sh

          cat > docs/concurrency.md <<'MD'
          # Swift concurrency ownership

          `SiriRemoteCore` is required to build and test with `-warn-concurrency` and
          `-strict-concurrency=complete` without warnings. The App is also compiled in complete
          concurrency-checking mode in CI, but its current AppKit/Cocoa ownership migration is
          tracked by `scripts/swift-concurrency-baseline.txt`. The gate rejects any new warning or
          an increased count for an existing warning. Existing entries may only stay flat or shrink.

          The App baseline is migration debt, not a statement that every diagnostic is harmless.
          A full `@MainActor` experiment showed that converting the legacy AppKit composition root,
          timers, notifications, and HUD/window controllers is an architecture migration: it changes
          isolation at `main.swift`, deinitializers, Timer callbacks, and Notification callbacks.
          That migration must be behavior-tested separately rather than mixed into a safety cleanup.

          ## Audited unchecked-Sendable invariants

          `@unchecked Sendable` is allowed only where the type documents the synchronization rule:

          - Voice audio capture and Corpus WAV spooling confine mutable state to a serial queue or lock.
          - Voice history serializes its cache/filesystem state; blocking reads use same-queue guards.
          - Realtime callback routing and correction monitoring protect shared tokens/handlers by lock.
          - Realtime transcription protects close state by lock and transcript state by actor; its
            receive task is installed before the object escapes `connect`.
          - Voice text delivery owns cross-process Accessibility work on a private serial worker.
          - Voice feedback confines AVAudioPlayer instances to its playback queue.
          - Voice text processing protects mutable prewarm caches by lock and delegates history writes
            to the queue-owned history store.
          - The Corpus persistence helper carries immutable snapshots across its I/O boundary.
          - The self-test timing probe uses a lock around its single mutable timestamp.

          Queue-confined synchronous helpers must execute inline when already on their own queue.
          `VoiceAudioCaptureSession`, `VoiceHistoryStore`, and Corpus termination draining follow this
          rule so a future queue-owned caller cannot introduce a sync-to-self deadlock.

          Do not suppress a new diagnostic merely by adding `@unchecked Sendable`. Either establish
          and document a real ownership invariant, move the state behind an actor/serial queue/lock,
          or keep the warning visible until the structural migration owns it.
          MD

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          text = p.read_text()
          text = text.replace(
              '      - name: Build\n        run: swift build --package-path SiriRemoteCore\n      - name: Test\n        run: swift test --package-path SiriRemoteCore\n',
              '''      - name: Build with complete concurrency checking\n        run: swift build --package-path SiriRemoteCore -Xswiftc -warn-concurrency -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors\n      - name: Test with complete concurrency checking\n        run: swift test --package-path SiriRemoteCore -Xswiftc -warn-concurrency -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors\n'''
          )
          text = text.replace(
              '      - name: Build app\n        working-directory: app\n        run: ./build.sh\n',
              '      - name: Build app and reject new concurrency diagnostics\n        run: ./scripts/check-swift-concurrency.sh\n'
          )
          text = text.replace(
              '            app/build.sh \\\n',
              '            app/build.sh \\\n            scripts/check-swift-concurrency.sh \\\n'
          )
          p.write_text(text)
          PY

      - name: Validate permanent gate and normal tests
        run: |
          git diff --check
          bash -n app/build.sh scripts/check-swift-concurrency.sh
          swift build --package-path SiriRemoteCore -Xswiftc -warn-concurrency -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          swift test --package-path SiriRemoteCore -Xswiftc -warn-concurrency -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          ./scripts/check-swift-concurrency.sh

      - name: Commit final concurrency closeout
        run: |
          git config user.name "tevriq"
          git config user.email "318064862+tevriq@users.noreply.github.com"
          git add app/TuneSettings.swift app/VoiceTranscriptionClient.swift app/VoiceFeedbackSound.swift app/VoiceTextProcessing.swift app/VoiceTextDelivery.swift app/build.sh scripts/check-swift-concurrency.sh scripts/swift-concurrency-baseline.txt docs/concurrency.md .github/workflows/ci.yml
          git commit -m "ci: enforce Swift concurrency debt boundary By ChatGPT"
          git push origin HEAD
