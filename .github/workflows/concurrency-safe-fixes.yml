name: Concurrency Safe Fixes

on:
  push:
    branches:
      - 'chatgpt/concurrency-closeout-20261008'
    paths:
      - '.github/workflows/concurrency-safe-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe value and queue ownership fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          # Pure value types cross Dispatch/Task boundaries. All stored fields are value types.
          replace_once('SiriRemoteCore/Sources/SiriRemoteCore/Action.swift',
                       'public enum Action: Equatable {',
                       'public enum Action: Equatable, Sendable {')
          replace_once('SiriRemoteCore/Sources/SiriRemoteCore/CircularScroll.swift',
                       'public struct CircularScrollConfig: Equatable {',
                       'public struct CircularScrollConfig: Equatable, Sendable {')

          p = Path('SiriRemoteCore/Sources/SiriRemoteCore/Config.swift')
          text = p.read_text()
          pairs = [
              ('public struct Config: Equatable {', 'public struct Config: Equatable, Sendable {'),
              ('public struct Settings: Equatable {', 'public struct Settings: Equatable, Sendable {'),
              ('public struct Mode: Equatable {', 'public struct Mode: Equatable, Sendable {'),
              ('public struct Presentation: Equatable {', 'public struct Presentation: Equatable, Sendable {'),
              ('public struct LayerDefinition: Codable, Equatable {', 'public struct LayerDefinition: Codable, Equatable, Sendable {'),
              ('public enum DictationOutputMode: String, Codable, CaseIterable, Hashable {', 'public enum DictationOutputMode: String, Codable, CaseIterable, Hashable, Sendable {'),
              ('public enum DictationMode: String, Codable, CaseIterable, Hashable {', 'public enum DictationMode: String, Codable, CaseIterable, Hashable, Sendable {'),
              ('public enum DictationLayerMode: String, Codable, CaseIterable, Hashable {', 'public enum DictationLayerMode: String, Codable, CaseIterable, Hashable, Sendable {'),
              ('public enum DictationCleanupProvider: String, Codable, CaseIterable {', 'public enum DictationCleanupProvider: String, Codable, CaseIterable, Sendable {'),
              ('public enum DictationSelectionEditProvider: String, Codable, CaseIterable {', 'public enum DictationSelectionEditProvider: String, Codable, CaseIterable, Sendable {'),
              ('public struct DictationTerm: Codable, Equatable {', 'public struct DictationTerm: Codable, Equatable, Sendable {'),
              ('public struct DictationSettings: Codable, Equatable {', 'public struct DictationSettings: Codable, Equatable, Sendable {'),
          ]
          for old, new in pairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Config.swift: expected one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          replace_once('SiriRemoteCore/Sources/SiriRemoteCore/Controller.swift',
                       'public struct HandledAction: Equatable {',
                       'public struct HandledAction: Equatable, Sendable {')
          replace_once('SiriRemoteCore/Sources/SiriRemoteCore/Controller.swift',
                       'public enum LayerCycleTarget: Equatable {',
                       'public enum LayerCycleTarget: Equatable, Sendable {')

          # VoiceAudioCaptureSession is queue-confined. Prevent a future sync-to-self deadlock in
          # termination-only blocking drain without changing the normal async stop path.
          replace_once('app/VoiceAudioCapture.swift',
              '    private let queue = DispatchQueue(label: "com.hypervibe.voice-audio-capture",\n                                      qos: .userInitiated)\n',
              '    private let queue = DispatchQueue(label: "com.hypervibe.voice-audio-capture",\n                                      qos: .userInitiated)\n    private let queueKey = DispatchSpecificKey<Void>()\n')
          replace_once('app/VoiceAudioCapture.swift',
              '        if retainPCM { capturedPCM.reserveCapacity(65_536) }\n    }\n',
              '        if retainPCM { capturedPCM.reserveCapacity(65_536) }\n        queue.setSpecific(key: queueKey, value: ())\n    }\n')
          replace_once('app/VoiceAudioCapture.swift',
              '    func stopBlockingForTermination() -> VoiceCapturedAudio {\n        queue.sync { stopOnQueue() }\n    }\n',
              '''    func stopBlockingForTermination() -> VoiceCapturedAudio {\n        syncOnQueue { stopOnQueue() }\n    }\n\n    /// Synchronous access is termination/support-only. Execute inline when already on the capture\n    /// queue so a future queue-owned caller cannot deadlock by synchronising onto itself.\n    private func syncOnQueue<T>(_ work: () -> T) -> T {\n        if DispatchQueue.getSpecific(key: queueKey) != nil { return work() }\n        return queue.sync(execute: work)\n    }\n''')

          # VoiceHistoryStore has the same queue confinement contract; harden every blocking read.
          replace_once('app/VoiceHistory.swift',
              '    private let queue = DispatchQueue(label: "com.hypervibe.voice-history", qos: .utility)\n    private var cachedPayload: Payload?\n',
              '    private let queue = DispatchQueue(label: "com.hypervibe.voice-history", qos: .utility)\n    private let queueKey = DispatchSpecificKey<Void>()\n    private var cachedPayload: Payload?\n')
          replace_once('app/VoiceHistory.swift',
              '        historyURL = self.rootURL.appendingPathComponent("history.json", isDirectory: false)\n    }\n',
              '        historyURL = self.rootURL.appendingPathComponent("history.json", isDirectory: false)\n        queue.setSpecific(key: queueKey, value: ())\n    }\n')
          p = Path('app/VoiceHistory.swift')
          text = p.read_text()
          text = text.replace('        queue.sync { [self] in\n', '        syncOnQueue { [self] in\n')
          text = text.replace('    func flush() { queue.sync {} }\n', '    func flush() { syncOnQueue {} }\n')
          marker = '    private func loadLocked() -> Payload {\n'
          helper = '''    /// Blocking reads drain earlier writes, but may also be called by queue-owned support code.\n    /// Execute inline in that case instead of deadlocking on `queue.sync`.\n    private func syncOnQueue<T>(_ work: () -> T) -> T {\n        if DispatchQueue.getSpecific(key: queueKey) != nil { return work() }\n        return queue.sync(execute: work)\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('VoiceHistory.swift: loadLocked marker mismatch')
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text)
          PY
          git diff --check
          git diff --stat

      - name: Validate Core with complete concurrency checking
        run: |
          swift build --package-path SiriRemoteCore -Xswiftc -warn-concurrency -Xswiftc -strict-concurrency=complete
          swift test --package-path SiriRemoteCore -Xswiftc -warn-concurrency -Xswiftc -strict-concurrency=complete

      - name: Validate normal App build
        working-directory: app
        run: ./build.sh

      - name: Commit validated fixes
        run: |
          git config user.name "tevriq"
          git config user.email "318064862+tevriq@users.noreply.github.com"
          git add SiriRemoteCore app/VoiceAudioCapture.swift app/VoiceHistory.swift
          git commit -m "fix: close safe concurrency ownership gaps By ChatGPT"
          git push origin HEAD
